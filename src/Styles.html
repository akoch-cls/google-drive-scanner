<style id="app-styles">
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #dfe3ea;
    --text: #1d232c;
    --muted: #5f6b7a;
    --accent: #1a73e8;
    --accent-strong: #1557b0;
    --accent-soft: #e8f0fe;
    --good: #1e8e3e;
    --warn: #e37400;
    --bad: #d93025;
    --stage: #12161c;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(20, 30, 50, .12), 0 2px 6px rgba(20, 30, 50, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --surface: #1a1f27;
      --surface-2: #232934;
      --border: #313948;
      --text: #e7ebf1;
      --muted: #9aa5b5;
      --accent: #8ab4f8;
      --accent-strong: #aecbfa;
      --accent-soft: #1f2c44;
      --good: #81c995;
      --warn: #fdd663;
      --bad: #f28b82;
      --stage: #000;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small-text { font-size: 12.5px; margin: 0; }
  .spacer { flex: 1; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.center { justify-content: center; align-items: center; }
  .grow { flex: 1; }
  kbd {
    font: 600 11px/1 ui-monospace, Menlo, monospace;
    background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 2px 6px;
  }

  /* ---------- Buttons & inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
    font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
    background: var(--surface-2); color: var(--text);
    transition: background .15s, border-color .15s, opacity .15s, transform .05s;
  }
  a.btn { text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #0b1a33; } }
  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
  .btn.ghost { background: transparent; border-color: var(--border); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn.link { background: none; border: none; color: var(--accent); padding: 0 4px; height: auto; }
  .btn.link:hover { text-decoration: underline; }
  .btn.danger-ghost { background: transparent; border-color: var(--border); color: var(--bad); }
  .btn.danger-ghost:hover { background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .btn.small { height: 30px; padding: 0 12px; font-size: 13px; }
  .btn.large { height: 48px; font-size: 15px; }
  .btn.block { width: 100%; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: var(--text);
    font: 600 20px/1 inherit; cursor: pointer; display: inline-grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  input[type=text], input[type=search], input[type=number], input[type=datetime-local], textarea, .select {
    width: 100%; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; outline: none;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .select { width: auto; height: 38px; padding: 0 10px; cursor: pointer; max-width: 220px; }
  .select.block { width: 100%; max-width: none; }
  .narrow { width: 90px !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .brand svg { width: 26px; height: 26px; color: var(--accent); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted);
  }
  .chip.ok { color: var(--good); }
  .chip.off { color: var(--warn); }
  .target-banner {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--accent-soft); color: var(--text); border-bottom: 1px solid var(--border);
  }
  .target-banner svg { color: var(--accent); }
  .target-banner > div { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Layout ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .stage { min-height: 0; display: flex; flex-direction: column; padding: 16px 16px 8px; gap: 12px; }
  .viewport {
    position: relative; flex: 1; min-height: 220px; border-radius: var(--radius); overflow: hidden;
    background: var(--stage);
  }
  .viewport video, .viewport #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  .viewport video { object-fit: contain; }
  .hud {
    position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .status-pill, .focus-meter {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 99px;
    background: rgba(10, 14, 20, .62); color: #fff; font-weight: 600; backdrop-filter: blur(6px);
  }
  .status-pill .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #9aa5b5; transition: background .2s; }
  .status-pill.good .dot { background: #34d058; box-shadow: 0 0 0 4px rgba(52, 208, 88, .25); }
  .status-pill.warn .dot { background: #ffb020; }
  .status-pill.bad .dot { background: #ff5b4f; }
  .focus-meter { font-size: 12px; font-weight: 500; }
  .focus-meter .bar { width: 90px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  .focus-meter .bar div { height: 100%; width: 0; border-radius: 3px; background: #ff5b4f; transition: width .15s, background .2s; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .35s ease-out; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }
  .camera-error, .drop-hint {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 24px; text-align: center; color: #e7ebf1; background: var(--stage);
  }
  .camera-error svg { width: 46px; height: 46px; opacity: .7; }
  .camera-error h3 { margin: 6px 0 0; font-size: 18px; }
  .camera-error p { margin: 0 0 12px; max-width: 420px; color: #b8c1cf; }
  .camera-error .popout-note { margin: 10px 0 0; font-size: 12.5px; color: #8d97a6; }
  .camera-error .btn.link { color: #8ab4f8; margin-top: 6px; }
  .drop-hint { background: rgba(26, 115, 232, .85); font-size: 20px; font-weight: 600; border: 3px dashed #fff; border-radius: var(--radius); }

  .controls { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .control-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .control-group.right { justify-content: flex-end; }
  .hint { margin: 0; text-align: center; color: var(--muted); font-size: 12.5px; }

  .shutter {
    --p: 0; position: relative; width: 74px; height: 74px; border-radius: 50%; border: none; cursor: pointer;
    background: conic-gradient(var(--good) calc(var(--p) * 1turn), var(--border) 0);
    padding: 0; display: grid; place-items: center; transition: transform .1s;
  }
  .shutter .ring { position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
  .shutter .core { position: absolute; inset: 10px; border-radius: 50%; background: var(--accent); transition: transform .1s, background .2s; }
  .shutter:hover .core { background: var(--accent-strong); }
  .shutter:active { transform: scale(.94); }
  .shutter:disabled { opacity: .4; cursor: not-allowed; }

  .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; user-select: none; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle .track { width: 40px; height: 24px; border-radius: 12px; background: var(--border); position: relative; transition: background .2s; flex: none; }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .toggle input:checked + .track { background: var(--accent); }
  .toggle input:checked + .track .knob { transform: translateX(16px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Pages panel ---------- */
  .pages-panel { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .panel-head h2 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .count { font-size: 12px; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; }
  .page-list { flex: 1; overflow-y: auto; padding: 10px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  .page-list .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 10px; }
  .page-list .empty svg { width: 54px; height: 54px; opacity: .45; margin-bottom: 8px; }
  .thumb {
    position: relative; aspect-ratio: 8.5 / 11; border-radius: 8px; overflow: hidden; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: transform .15s, box-shadow .15s;
  }
  .thumb:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.12); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .thumb .num { position: absolute; left: 6px; bottom: 6px; background: rgba(10,14,20,.7); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; }
  .thumb .del {
    position: absolute; right: 5px; top: 5px; width: 24px; height: 24px; border-radius: 50%; border: none;
    background: rgba(10,14,20,.7); color: #fff; cursor: pointer; font-size: 15px; line-height: 1; opacity: 0; transition: opacity .15s;
  }
  .thumb:hover .del, .thumb:focus-within .del { opacity: 1; }
  .thumb.new { animation: pop .4s ease-out; }
  .thumb.dragging { opacity: .4; }
  .thumb.drop-before { box-shadow: -4px 0 0 var(--accent); }
  .thumb.drop-after { box-shadow: 4px 0 0 var(--accent); }
  .thumb .spinner { position: absolute; inset: 0; margin: auto; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel-foot { padding: 14px 16px; border-top: 1px solid var(--border); }

  /* ---------- Modals ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
    background: rgba(8, 12, 18, .5); animation: fade .15s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal-card {
    position: relative; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow);
    width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { transform: translateY(12px); opacity: .5; } }
  .modal-head { display: flex; align-items: center; gap: 6px; padding: 12px 14px 10px 20px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--border); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .input-suffix { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .input-suffix:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input-suffix input { border: none; box-shadow: none !important; }
  .input-suffix span { padding: 0 12px; color: var(--muted); }
  .form-error { margin: 0; color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); padding: 10px 12px; border-radius: 10px; }
  .notice { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
  .notice .copy-row { display: flex; gap: 8px; margin-top: 8px; }
  .notice input { font-size: 12.5px; }
  .busy {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: color-mix(in srgb, var(--surface) 88%, transparent); font-weight: 600; z-index: 2;
  }
  .busy p { margin: 0; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
  .tabs button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border: none;
    border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabs button svg { width: 18px; height: 18px; }
  .tab-panel { display: flex; flex-direction: column; gap: 12px; }

  /* Save: destination */
  .save-card { max-width: 560px; }
  .dest { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; }
  .folder-icon { width: 28px; height: 28px; color: var(--accent); }
  .dest-text { flex: 1; min-width: 0; }
  .dest-name { font-weight: 700; font-size: 15px; }
  .dest-path { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chips button {
    display: inline-flex; align-items: center; gap: 6px; max-width: 220px; height: 32px; padding: 0 12px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
  }
  .chips button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips button svg { width: 16px; height: 16px; color: var(--muted); }
  .chips button:hover { background: var(--surface-2); }
  .chips button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chips button.active svg { color: var(--accent); }
  .browser { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .browser-top { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 8px 10px 4px; font-size: 13px; }
  .crumbs button { border: none; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
  .crumbs button:hover { background: var(--accent-soft); }
  .crumbs button:last-child { color: var(--text); font-weight: 700; }
  .crumbs .sep { color: var(--muted); }
  .new-folder { display: flex; gap: 8px; padding: 6px 10px; }
  .folder-list { list-style: none; margin: 0; padding: 4px; height: 230px; overflow-y: auto; }
  .folder-list li button {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: none; background: none;
    color: var(--text); font: inherit; text-align: left; border-radius: 8px; cursor: pointer;
  }
  .folder-list li button:hover { background: var(--surface-2); }
  .folder-list li button svg { color: var(--muted); }
  .folder-list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-list .sub { font-size: 12px; color: var(--muted); }
  .folder-list .msg { color: var(--muted); text-align: center; padding: 30px 10px; }
  .browser-foot { display: flex; justify-content: flex-end; padding: 8px 10px; border-top: 1px solid var(--border); }

  /* Save: classroom */
  .assignment-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .assignment-list .msg { color: var(--muted); text-align: center; padding: 20px 10px; }
  .assignment {
    display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer; background: var(--surface);
  }
  .assignment:hover { background: var(--surface-2); }
  .assignment.selected { border-color: var(--accent); background: var(--accent-soft); }
  .assignment.disabled { opacity: .55; cursor: not-allowed; }
  .assignment input { margin-top: 3px; accent-color: var(--accent); }
  .assignment .a-main { flex: 1; min-width: 0; }
  .assignment .a-title { font-weight: 600; }
  .assignment .a-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .badge.accent { color: var(--accent); background: var(--accent-soft); }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { width: 17px; height: 17px; accent-color: var(--accent); }

  /* Result */
  .result-card { max-width: 440px; padding: 28px 26px 22px; text-align: center; align-items: center; gap: 6px; }
  .result-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px; }
  .result-icon svg { width: 34px; height: 34px; stroke-width: 2.4; }
  .result-icon.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .result-icon.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .result-card h3 { margin: 0; font-size: 20px; }
  .result-body { color: var(--muted); width: 100%; }
  .result-body ol { text-align: left; margin: 12px 0 0; padding-left: 22px; color: var(--text); }
  .result-body li { margin-bottom: 4px; }
  .result-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 16px; }

  /* Editor */
  .editor-card { max-width: 1060px; height: min(760px, calc(100vh - 32px)); }
  .editor-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
  .crop-wrap { min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--surface-2); }
  .crop-area { position: relative; flex: 1; min-height: 0; touch-action: none; }
  .crop-area canvas#cropCanvas, .crop-area svg { position: absolute; }
  .crop-area svg { width: auto; height: auto; overflow: visible; stroke: none; }
  .crop-area .shade { fill: rgba(8, 12, 18, .55); fill-rule: evenodd; }
  .crop-area .edge { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .crop-area .handle { fill: #fff; stroke: var(--accent); stroke-width: 3; vector-effect: non-scaling-stroke; cursor: grab; }
  .crop-area .hit { fill: transparent; cursor: grab; }
  .crop-area.dragging .handle, .crop-area.dragging .hit { cursor: grabbing; }
  .loupe { position: absolute; width: 132px; height: 132px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.4); pointer-events: none; background: #000; }
  .editor-side { border-left: 1px solid var(--border); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .preview-box { position: relative; height: 200px; flex: none; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
  .preview-box img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
  .preview-box .spinner { position: absolute; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button {
    height: 34px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text);
